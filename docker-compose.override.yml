services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-twave_01} -d ${PG_DATABASE:-qa_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  solr:
    healthcheck:
      test: ["CMD-SHELL", "solr status > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  rag-python:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      RAG_HYBRID_BM25_WEIGHT: "0.8"
      RAG_HYBRID_VECTOR_WEIGHT: "0.2"
      RAG_LEXICAL_STRICT_FIRST: "0"
      RAG_SEMANTIC_BM25_ONLY: "0"
      RAG_SEMANTIC_VECTOR_ONLY: "1"
      RAG_SEMANTIC_BM25_WEIGHT: "0.4"
      RAG_SEMANTIC_VECTOR_WEIGHT: "0.6"
      SOLR_CORE_NAME: mycore
      SOLR_URL: http://solr:8983
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      solr:
        condition: service_healthy

  api:
    environment:
      RAG_BACKEND_TIMEOUT_MS: "4000"
      RAG_CONTEXT_DEDUP: "1"
      RAG_CROSS_LANGUAGE_BRIDGE_ENABLED: "1"
      RAG_GENERATION_MIN_CONFIDENCE: "0"
      RAG_HYBRID_SOLR_WEIGHT: "0.4"
      RAG_HYBRID_VECTOR_WEIGHT: "0.6"
      RAG_MAX_DOCUMENTS: "4"
      RAG_RESPONSE_CACHE_ENABLED: "1"
      RAG_LEXICAL_STRICT_FIRST: "0"
      RAG_SEMANTIC_BM25_ONLY: "0"
      RAG_SEMANTIC_VECTOR_ONLY: "1"
      RAG_SEMANTIC_BM25_WEIGHT: "0.4"
      RAG_SEMANTIC_VECTOR_WEIGHT: "0.6"
      RAG_SERVICE_URL: http://rag-python:8010
      RAG_SOLR_ROWS: "12"
      RAG_VECTOR_RETRIEVAL_ENABLED: "1"
      RAG_VECTOR_TIMEOUT_MS: "15000"
      RAG_VECTOR_TOP_K: "8"
      RAG_EVIDENCE_MAX_ITEMS: "6"
      RAG_CONTEXT_MAX_TOKENS: "3000"
      RAG_EVIDENCE_ALLOW_CROSS_DOC_FALLBACK: "1"
      LLM_BASE_URL: "http://host.docker.internal:9080/v1"
      LLM_MODEL: "qwen3-30B-A3B-Instruct-2507-FP8"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy

  worker:
    environment:
      RAG_BACKEND_TIMEOUT_MS: "4000"
      RAG_CONTEXT_DEDUP: "1"
      RAG_CROSS_LANGUAGE_BRIDGE_ENABLED: "1"
      RAG_GENERATION_MIN_CONFIDENCE: "0"
      RAG_HYBRID_SOLR_WEIGHT: "0.4"
      RAG_HYBRID_VECTOR_WEIGHT: "0.6"
      RAG_MAX_DOCUMENTS: "4"
      RAG_RESPONSE_CACHE_ENABLED: "1"
      RAG_LEXICAL_STRICT_FIRST: "0"
      RAG_SEMANTIC_BM25_ONLY: "0"
      RAG_SEMANTIC_VECTOR_ONLY: "1"
      RAG_SEMANTIC_BM25_WEIGHT: "0.4"
      RAG_SEMANTIC_VECTOR_WEIGHT: "0.6"
      RAG_SERVICE_URL: http://rag-python:8010
      RAG_SOLR_ROWS: "12"
      RAG_VECTOR_RETRIEVAL_ENABLED: "1"
      RAG_VECTOR_TIMEOUT_MS: "15000"
      RAG_VECTOR_TOP_K: "8"
      RAG_EVIDENCE_MAX_ITEMS: "6"
      RAG_CONTEXT_MAX_TOKENS: "3000"
      RAG_EVIDENCE_ALLOW_CROSS_DOC_FALLBACK: "1"
      LLM_BASE_URL: "http://host.docker.internal:9080/v1"
      LLM_MODEL: "qwen3-30B-A3B-Instruct-2507-FP8"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy

  ui:
    depends_on:
      api:
        condition: service_healthy
